<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awesome Shop</title>
    <link rel="stylesheet" href="stylesheets/style.css">
</head>
<body>
    <main>
        <div class="container">
            <form id="payment-form" action="/api/webpayplus/create" method="POST">
                <label class="label">Webpay</label>
                <figure class="image is-2by3">
                    <img src="https://images.unsplash.com/photo-1517423568366-8b83523034fd?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60" alt="Product">
                </figure>
                <button class="button is-success" type="submit">
                    Comprar por $9.990
                </button>
                <input type="hidden" name="amount" value="9990">
                <input type="hidden" name="buyOrder" value="O-76341">
                <input type="hidden" name="sessionId" value="S-62951">
                <input type="hidden" name="returnUrl" value="http://localhost:3000/webpayplus/commit">
            </form>
        </div>
    </main>
    <script src="javascripts/main.js"></script>
</body>
</html>
